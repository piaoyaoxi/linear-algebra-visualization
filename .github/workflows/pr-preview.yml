name: PR static preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write
  issues: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose staged Chapter 1 rebuild
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile, traceback

          lines = []
          try:
              parts = sorted(Path('_dev').glob('ch1-payload.part*'))
              lines.append('parts: ' + ', '.join(p.name for p in parts))
              for part in parts:
                  data = part.read_bytes()
                  lines.append(f'{part.name}: length={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
              payload = b''.join(part.read_bytes() for part in parts)
              lines.append(f'combined length: {len(payload)}')
              lines.append(f'combined sha256: {hashlib.sha256(payload).hexdigest()}')
              archive = base64.b64decode(payload, validate=True)
              lines.append(f'archive length: {len(archive)}')
              lines.append(f'archive sha256: {hashlib.sha256(archive).hexdigest()}')
              Path('/tmp/ch1-rebuild.tar.gz').write_bytes(archive)
              with tarfile.open('/tmp/ch1-rebuild.tar.gz', 'r:gz') as tar:
                  names = tar.getnames()
                  lines.append(f'archive entries: {len(names)}')
                  lines.extend(names[:25])
          except Exception:
              lines.append('ERROR:')
              lines.append(traceback.format_exc())
          Path('/tmp/ch1-diag.txt').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Post diagnostic report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ch1-payload-diagnostic -->';
            const report = fs.readFileSync('/tmp/ch1-diag.txt', 'utf8');
            const body = `${marker}\n## Chapter 1 payload diagnostic\n\n\`\`\`text\n${report}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo cleanup