name: PR static preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write

jobs:
  publish-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Persist staged payload diagnostic
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f _dev/ch1-diag.txt ]; then
            cat _dev/ch1-diag.txt
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile, traceback

          lines = []
          try:
              parts = sorted(Path('_dev').glob('ch1-payload.part*'))
              lines.append('parts: ' + ', '.join(p.name for p in parts))
              for part in parts:
                  data = part.read_bytes()
                  lines.append(f'{part.name}: length={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
              payload = b''.join(part.read_bytes() for part in parts)
              lines.append(f'combined length: {len(payload)}')
              lines.append(f'combined sha256: {hashlib.sha256(payload).hexdigest()}')
              archive = base64.b64decode(payload, validate=True)
              lines.append(f'archive length: {len(archive)}')
              lines.append(f'archive sha256: {hashlib.sha256(archive).hexdigest()}')
              Path('/tmp/ch1-rebuild.tar.gz').write_bytes(archive)
              with tarfile.open('/tmp/ch1-rebuild.tar.gz', 'r:gz') as tar:
                  names = tar.getnames()
                  lines.append(f'archive entries: {len(names)}')
                  lines.extend(names)
          except Exception:
              lines.append('ERROR:')
              lines.append(traceback.format_exc())
          Path('_dev/ch1-diag.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _dev/ch1-diag.txt
          git commit -m 'chore(ch1): record payload diagnostics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo cleanup