name: Apply Chapter 7 context payload

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-ch7-context.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out context branch
        uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
      - name: Report payload checksum
        run: 'echo "PAYLOAD_SHA256=$(cat .github/ch7-payload/part-* | base64 -d 2>/dev/null | sha256sum | cut -d" " -f1)"; exit 1'
