name: Apply Chapter 10 mobile screenshot positioning fix

on:
  push:
    branches: [content/ch10-dual-bilinear-symplectic]
    paths: [scripts/ch10-mobile-audit-position.patch.gz.b64]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ch10-dual-bilinear-symplectic
          fetch-depth: 0
      - name: Apply mobile audit positioning patch
        run: |
          set -euo pipefail
          base64 -d scripts/ch10-mobile-audit-position.patch.gz.b64 | gzip -d > /tmp/ch10-mobile-audit-position.patch
          git apply --check /tmp/ch10-mobile-audit-position.patch
          git apply /tmp/ch10-mobile-audit-position.patch
          rm scripts/ch10-mobile-audit-position.patch.gz.b64
          rm .github/workflows/ch10-apply-mobile-audit-position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ch10): capture mobile cinema below floating controls"
          git push origin HEAD:content/ch10-dual-bilinear-symplectic