name: Patch Chapter 7 browser assertion

on:
  push:
    branches:
      - context/ch7-linear-transformations
    paths:
      - ".github/workflows/patch-ch7-browser-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chapter 7 branch
        uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
          fetch-depth: 0
      - name: Relax chain text assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/ch7-browser-check.mjs')
          text = path.read_text()
          old = 'assert.match(compact(await page.locator(".ch7-chain").innerText()), /v2N→v1N→0/);'
          new = 'assert.match(compact(await page.locator(".ch7-chain").innerText()), /v2.*N→v1.*N→0/);'
          if old not in text:
              raise SystemExit('target assertion not found')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-ch7-browser-test.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ch7): allow explanatory Jordan labels"
          git push origin HEAD:context/ch7-linear-transformations
