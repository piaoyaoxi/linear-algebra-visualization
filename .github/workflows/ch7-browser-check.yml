name: Chapter 7 browser check

on:
  pull_request:
    paths:
      - "current/**"
      - "docs/ch7-*.md"
      - ".github/scripts/ch7-browser-check.mjs"
      - ".github/workflows/ch7-browser-check.yml"
  push:
    branches:
      - context/ch7-linear-transformations

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory current > /tmp/ch7-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/learn.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ch7-http.log
          exit 1

      - name: Exercise Chapter 7 in Chromium
        run: node .github/scripts/ch7-browser-check.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter7-browser-evidence
          path: test-results/ch7-browser-evidence
          if-no-files-found: warn
          retention-days: 7
