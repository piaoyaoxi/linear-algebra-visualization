name: Patch Chapter 7 dark-mode setup

on:
  push:
    branches:
      - context/ch7-linear-transformations
    paths:
      - ".github/workflows/patch-ch7-dark-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chapter 7 branch
        uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
          fetch-depth: 0
      - name: Reload after changing saved theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/ch7-browser-check.mjs')
          text = path.read_text()
          old = '''await page.evaluate(() => localStorage.setItem("la-visual-theme", "dark"));
          for (const route of routes) {'''
          new = '''await page.evaluate(() => localStorage.setItem("la-visual-theme", "dark"));
          await page.reload({ waitUntil: "networkidle" });
          for (const route of routes) {'''
          if old not in text:
              raise SystemExit('dark-mode setup not found')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-ch7-dark-test.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ch7): reload after selecting dark appearance"
          git push origin HEAD:context/ch7-linear-transformations
