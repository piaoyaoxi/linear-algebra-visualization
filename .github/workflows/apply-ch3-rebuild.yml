name: Apply Chapter 3 rebuild

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'content/ch3-linear-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH_NAME: content/ch3-linear-systems
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch branch
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${BRANCH_NAME}"
          git checkout -q -B "${BRANCH_NAME}" FETCH_HEAD

      - name: Extract reviewed Chapter 3 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          source = Path('.ch3-rebuild.tar.xz.b64').read_text().strip()
          print('base64 chars:', len(source), 'prefix:', source[:8], 'suffix:', source[-8:])
          payload = base64.b64decode(source, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          print('archive bytes:', len(payload), 'sha256:', digest)
          if digest != '69d33a5059299dcc29c93ff1333e6605ab126fc14d2250a2bf183e306826cf0f':
              raise SystemExit('archive checksum mismatch')
          Path('.ch3-rebuild.tar.xz').write_bytes(payload)
          PY
          tar -xJf .ch3-rebuild.tar.xz
          sed -i 's/ch3c/ch3d/g' current/learn.html

      - name: Run static checks
        run: |
          find current/content current/visuals/ch3 -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

      - name: Commit rebuilt chapter and remove transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .ch3-rebuild.tar.xz
          git rm .ch3-rebuild.tar.xz.b64 .github/workflows/apply-ch3-rebuild.yml
          git add current/content/ch3.js current/content/ch3-section*.js current/visuals/ch3 docs/ch3-production-matrix.md current/learn.html
          git commit -m "feat(ch3): rebuild lessons and exact interactions"
          git push -q origin HEAD:"${BRANCH_NAME}"
