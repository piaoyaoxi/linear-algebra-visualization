name: PR static preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write
  issues: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: preview/pr-${{ github.event.pull_request.number }}
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/
    env:
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply staged Chapter 1 rebuild
        if: github.event.pull_request.number == 36
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cat _dev/ch1-payload.part* | base64 -d > /tmp/ch1-rebuild.tar.gz
          tar -xzf /tmp/ch1-rebuild.tar.gz
          sed -i 's/ch1c/ch1d/g' current/learn.html
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_dev/ch1-browser-check.cjs')
          text = path.read_text()
          text = text.replace(
              'await page.locator("#themeToggle").click();\n  assert(await page.locator("body.dark").count() === 1, "dark theme did not activate");',
              'await page.locator("#themeToggle").click();\n  await page.waitForFunction(() => document.body.classList.contains("dark"), null, { timeout: 5000 });\n  assert(await page.locator("body.dark").count() === 1, "dark theme did not activate");',
          )
          path.write_text(text)
          PY

      - name: Check Chapter 1 syntax and exact arithmetic
        if: github.event.pull_request.number == 36
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for file in current/content/ch1-section*.js current/visuals/ch1/*.js; do
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {} };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('current/visuals/ch1/poly-math.js', 'utf8'), sandbox);
          const P = sandbox.window.Ch1Poly;
          function eq(actual, expected, message) {
            const a = JSON.stringify(actual);
            const b = JSON.stringify(expected);
            if (a !== b) throw new Error(`${message}: ${a} !== ${b}`);
          }
          eq(P.parseRational('0.125'), { n: 1, d: 8 }, 'decimal parser');
          eq(P.parseRational('-3/4'), { n: -3, d: 4 }, 'fraction parser');
          const f = P.fromIntegers([2, -1, 0, 3]);
          const g = P.fromIntegers([-2, 1, 1, -3]);
          eq(P.toIntegers(P.add(f, g)), [0, 0, 1], 'leading cancellation');
          eq(P.coefficient(P.multiply(f, g), 3), { n: -13, d: 1 }, 'target coefficient');
          const division = P.divide(P.fromIntegers([-1, 0, 0, 0, 1]), P.fromIntegers([1, 1, 1]));
          eq(P.toIntegers(division.quotient), [0, -1, 1], 'division quotient');
          eq(P.toIntegers(division.remainder), [-1, 1], 'division remainder');
          const ext = P.extendedGcd(P.fromIntegers([-1, 0, 0, 0, 1]), P.fromIntegers([-1, 0, 0, 1]));
          eq(P.toIntegers(ext.gcd), [-1, 1], 'gcd');
          eq(P.toIntegers(P.add(P.multiply(ext.s, P.fromIntegers([-1, 0, 0, 0, 1])), P.multiply(ext.t, P.fromIntegers([-1, 0, 0, 1])))), [-1, 1], 'Bezout identity');
          const interpolant = P.interpolate([
            { x: P.rational(0), y: P.rational(1) },
            { x: P.rational(1), y: P.rational(2) },
            { x: P.rational(2), y: P.rational(5) },
          ]);
          eq(P.toIntegers(interpolant), [1, 0, 1], 'interpolation');
          console.log('Exact Chapter 1 arithmetic checks passed.');
          NODE

      - name: Install pinned Chromium harness
        if: github.event.pull_request.number == 36
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-playwright
          cd /tmp/ch1-playwright
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Browser-check all eleven Chapter 1 lessons
        if: github.event.pull_request.number == 36
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 -d current >/tmp/ch1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/learn.html >/dev/null; then
              break
            fi
            sleep 1
          done
          NODE_PATH=/tmp/ch1-playwright/node_modules node _dev/ch1-browser-check.cjs

      - name: Upload Chapter 1 browser screenshots
        if: always() && github.event.pull_request.number == 36
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-browser-screenshots
          path: /tmp/ch1-browser-artifacts
          if-no-files-found: warn

      - name: Commit the verified Chapter 1 rebuild
        if: github.event.pull_request.number == 36
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/pr-preview.yml > .github/workflows/pr-preview.yml
          rm -f .github/workflows/ch1-finalize.yml _dev/ch1-payload.part* _dev/ch1-browser-check.cjs
          git config user.name 'GPT-5.6 Thinking'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit \
            -m 'feat(ch1): rebuild polynomial chapter as complete visual course' \
            -m 'Rebuild all eleven lessons around the Chapter 1 production blueprint, exact polynomial arithmetic, real interactive workbenches, richer examples and self-tests, and responsive browser-verified presentation.' \
            -m 'Co-Authored-By: GPT-5.6 Thinking <noreply@openai.com>'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          persist-credentials: true

      - name: Publish current website under this pull request
        id: publish
        run: |
          target="pages/docs/previews/pr-${{ github.event.pull_request.number }}"
          rm -rf "$target"
          mkdir -p "$target"
          rsync -a --delete --exclude '.DS_Store' source/current/ "$target/"
          touch pages/docs/.nojekyll

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "preview: update PR #${{ github.event.pull_request.number }}"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:gh-pages; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              git fetch origin gh-pages
              git rebase origin/gh-pages
            done
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post or update preview link
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const marker = '<!-- pr-static-preview -->';
            const body = `${marker}\n## PR preview\n\n[Open this PR\'s website preview](${process.env.PREVIEW_URL})\n\nThis link is updated whenever the PR changes. The preview is removed when the PR closes.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          persist-credentials: true

      - name: Remove this pull request preview
        run: |
          cd pages
          rm -rf "docs/previews/pr-${{ github.event.pull_request.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.com"
          git add -A docs/previews
          if ! git diff --cached --quiet; then
            git commit -m "preview: remove PR #${{ github.event.pull_request.number }}"
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:gh-pages; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              git fetch origin gh-pages
              git rebase origin/gh-pages
            done
          fi