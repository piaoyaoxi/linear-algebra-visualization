name: Node and Playwright
description: Node from .nvmrc and the Playwright pinned in package-lock.json, with its Chromium.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install the pinned Playwright and its Chromium
      shell: bash
      run: |
        npm ci --no-audit --no-fund
        npx playwright install --with-deps chromium
