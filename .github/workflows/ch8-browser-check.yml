name: Chapter 8 browser check

on:
  pull_request:
    paths:
      - "current/**"
      - ".github/scripts/ch8-browser-check.mjs"
      - ".github/workflows/ch8-browser-check.yml"

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Chapter 8 source
        run: |
          set -euo pipefail
          for file in current/content/ch8*.js current/visuals/ch8/*.js; do
            node --check "$file"
          done
          node --check .github/scripts/ch8-browser-check.mjs
          git diff --check

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/ch8-npm-install.log 2>&1 || { cat /tmp/ch8-npm-install.log; exit 1; }
          npx playwright install --with-deps chromium >/tmp/ch8-playwright-install.log 2>&1 || { cat /tmp/ch8-playwright-install.log; exit 1; }

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory current > /tmp/ch8-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/learn.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ch8-http.log
          exit 1

      - name: Exercise Chapter 8 in Chromium
        run: node .github/scripts/ch8-browser-check.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter8-browser-evidence
          path: test-results/ch8-browser-evidence
          if-no-files-found: warn
          retention-days: 7
