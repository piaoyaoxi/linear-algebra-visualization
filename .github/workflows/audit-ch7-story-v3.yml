name: Audit Chapter 7 story v3

on:
  push:
    branches:
      - context/ch7-linear-transformations
    paths:
      - ".github/workflows/audit-ch7-story-v3.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            node --check current/visuals/ch7/story-core.js
            for file in current/visuals/ch7/story-section{1..9}.js; do node --check "$file"; done
            node --check .github/scripts/ch7-browser-check.mjs
            git diff --check
          } 2>&1 | tee /tmp/ch7-validation.log
      - name: Install browser
        if: steps.validate.outcome == 'success'
        id: install
        continue-on-error: true
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/tmp/ch7-npm-install.log 2>&1
          npx playwright install --with-deps chromium >/tmp/ch7-playwright-install.log 2>&1
      - name: Run browser audit
        if: steps.validate.outcome == 'success' && steps.install.outcome == 'success'
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          python3 -m http.server 4173 --directory current >/tmp/ch7-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/learn.html >/dev/null && break
            sleep 1
          done
          node .github/scripts/ch7-browser-check-runner.mjs 2>&1 | tee /tmp/ch7-browser.log
      - name: Record audit outcome
        shell: bash
        run: |
          {
            echo "validation=${{ steps.validate.outcome }}"
            echo "install=${{ steps.install.outcome }}"
            echo "browser=${{ steps.browser.outcome }}"
            echo
            echo "--- validation log ---"
            cat /tmp/ch7-validation.log 2>/dev/null || true
            echo
            echo "--- browser log ---"
            cat /tmp/ch7-browser.log 2>/dev/null || true
            echo
            echo "--- server log ---"
            cat /tmp/ch7-http.log 2>/dev/null || true
          } > docs/ch7-v3-audit-report.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter7-story-v3-evidence
          path: test-results/ch7-browser-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Commit report and remove launcher
        shell: bash
        run: |
          rm -f .github/workflows/audit-ch7-story-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ch7): record third-round browser audit"
          git push origin HEAD:context/ch7-linear-transformations
      - name: Enforce success
        if: steps.validate.outcome != 'success' || steps.install.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
