name: PR static preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read
  issues: write

jobs:
  publish-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          show-progress: false

      - name: Diagnose and post staged payload
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile, traceback

          lines = ['<!-- ch1-payload-diagnostic -->', '## Chapter 1 payload diagnostic', '```text']
          try:
              parts = sorted(Path('_dev').glob('ch1-payload.part*'))
              lines.append('parts: ' + ', '.join(p.name for p in parts))
              for part in parts:
                  data = part.read_bytes()
                  lines.append(f'{part.name}: length={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
              payload = b''.join(part.read_bytes() for part in parts)
              lines.append(f'combined length: {len(payload)}')
              lines.append(f'combined sha256: {hashlib.sha256(payload).hexdigest()}')
              archive = base64.b64decode(payload, validate=True)
              lines.append(f'archive length: {len(archive)}')
              lines.append(f'archive sha256: {hashlib.sha256(archive).hexdigest()}')
              Path('/tmp/ch1-rebuild.tar.gz').write_bytes(archive)
              with tarfile.open('/tmp/ch1-rebuild.tar.gz', 'r:gz') as tar:
                  names = tar.getnames()
                  lines.append(f'archive entries: {len(names)}')
                  lines.extend(names)
          except Exception:
              lines.append('ERROR:')
              lines.append(traceback.format_exc())
          lines.append('```')
          Path('/tmp/ch1-comment.txt').write_text('\n'.join(lines) + '\n')
          PY
          jq -Rs '{body: .}' /tmp/ch1-comment.txt > /tmp/ch1-comment.json
          curl --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --data-binary @/tmp/ch1-comment.json

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo cleanup