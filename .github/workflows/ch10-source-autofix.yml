name: Chapter 10 source autofix

on:
  push:
    branches: [content/ch10-dual-bilinear-symplectic]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ch10-dual-bilinear-symplectic
      - name: Normalize the remaining TeX spacing escape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('current/visuals/ch10/section1-presentation.js')
          source = path.read_text()
          old = r'${format(result.a)}\;${format(result.b)}'
          new = r'${format(result.a)}\\;${format(result.b)}'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one spacing escape, found {count}')
          path.write_text(source.replace(old, new))
          PY
          node tests/ch10-source-audit.cjs
      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current/visuals/ch10/section1-presentation.js
          git commit -m "fix(ch10): preserve TeX row-vector spacing"
          git push origin HEAD:content/ch10-dual-bilinear-symplectic
