name: Chapter 6 browser check

# Native-theme review revision 2: source scan + four browser configurations.
on:
  push:
    branches:
      - "content/ch6-linear-spaces"
    paths:
      - "current/**"
      - ".github/scripts/ch6-browser-check.mjs"
      - ".github/scripts/ch6-browser-review.mjs"
      - ".github/scripts/ch6-source-style-check.mjs"
      - ".github/workflows/ch6-browser-check.yml"
  pull_request:
    paths:
      - "current/**"
      - ".github/scripts/ch6-browser-check.mjs"
      - ".github/scripts/ch6-browser-review.mjs"
      - ".github/scripts/ch6-source-style-check.mjs"
      - ".github/workflows/ch6-browser-check.yml"

permissions:
  contents: write

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reject off-brand Chapter 6 source styles
        shell: bash
        run: |
          mkdir -p /tmp/ch6-screenshots
          set +e
          node .github/scripts/ch6-source-style-check.mjs 2>&1 | tee /tmp/ch6-screenshots/source-style-report.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Start static site
        run: |
          python3 -m http.server 4173 --directory current > /tmp/ch6-static.log 2>&1 &
          echo $! > /tmp/ch6-static.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/learn.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ch6-static.log
          exit 1

      - name: Exercise Chapter 6 and compare project visual language in Chromium
        shell: bash
        run: |
          set +e
          node .github/scripts/ch6-browser-review.mjs 2>&1 | tee /tmp/ch6-screenshots/browser-check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch6-browser-screenshots
          path: /tmp/ch6-screenshots
          if-no-files-found: error

      - name: Record browser run id
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p docs
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
          } > docs/ch6-latest-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ch6-latest-run.txt
          git commit -m "chore(ch6): record browser run [skip ci]" || exit 0
          git push origin HEAD:content/ch6-linear-spaces
