name: Apply Chapter 7 context payload

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-ch7-context.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out context branch
        uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
      - name: Repair, verify, and extract payload
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/ch7-payload/part-06-1')
          text = path.read_text()
          old = 'Qgz084eXJ4555G176'
          new = 'Qgz084eXJ455G176'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          assert path.stat().st_size == 6000, path.stat().st_size
          PY
          cat .github/ch7-payload/part-* | base64 -d > /tmp/ch7-payload.tar.gz
          echo "6b1812a2a79b1779f34fc11bac295bc6aa41dad468ffa30ac6662e9901e3869d  /tmp/ch7-payload.tar.gz" | sha256sum -c -
          gzip -t /tmp/ch7-payload.tar.gz
          tar -xzf /tmp/ch7-payload.tar.gz
          rm -rf .github/ch7-payload
          rm -f .github/ch7-payload-diagnostics.txt
          rm -f .github/workflows/export-context.yml
          rm -f .github/workflows/apply-ch7-context.yml
      - name: Commit Chapter 7 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ch7): build linear transformation chapter"
          git push origin HEAD:context/ch7-linear-transformations
