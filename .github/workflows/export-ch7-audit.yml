name: Chapter 7 visual audit

on:
  push:
    branches:
      - context/ch7-linear-transformations
    paths:
      - ".github/scripts/ch7-visual-audit.mjs"
      - ".github/workflows/export-ch7-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/ch7-visual-audit.mjs"
      - ".github/workflows/export-ch7-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory current > /tmp/ch7-audit-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/learn.html >/dev/null && break; sleep 1; done
      - name: Capture visual audit
        run: node .github/scripts/ch7-visual-audit.mjs
      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: ch7-visual-audit
          path: test-results/ch7-visual-audit
          if-no-files-found: error
          retention-days: 3
