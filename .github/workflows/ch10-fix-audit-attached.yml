name: Fix Chapter 10 audit attached state

on:
  push:
    branches: [content/ch10-dual-bilinear-symplectic]
    paths: [scripts/ch10-fix-audit-attached.txt]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ch10-dual-bilinear-symplectic
          fetch-depth: 0
      - name: Fix hidden deep-lab selector and clean temporary files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/ch10-browser-audit.cjs')
          text = path.read_text()
          old = 'await page.waitForSelector(".ch10-primary-lab");'
          new = 'await page.waitForSelector(".ch10-primary-lab", { state: "attached" });'
          if old not in text:
              raise SystemExit('expected selector not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm scripts/ch10-fix-audit-attached.txt
          rm .github/workflows/ch10-fix-audit-attached.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(ch10): inspect collapsed deep labs as attached nodes"
          git push origin HEAD:content/ch10-dual-bilinear-symplectic