name: Chapter 10 source autofix

on:
  push:
    branches:
      - content/ch10-dual-bilinear-symplectic

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chapter 10 branch
        uses: actions/checkout@v4
        with:
          ref: content/ch10-dual-bilinear-symplectic

      - name: Repair generated formulas and layout constraints
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          presentation_files = [
              Path('current/visuals/ch10/section1-presentation.js'),
              Path('current/visuals/ch10/section2-presentation.js'),
              Path('current/visuals/ch10/section3-presentation.js'),
          ]
          repaired = 0
          for path in presentation_files:
              source = path.read_text()
              source, count = re.subn(r'(?<!\\)\\end\{', r'\\\\end{', source)
              repaired += count
              if path.name == 'section2-presentation.js':
                  source = source.replace('    mountIntuition,\n    mountInteractive,', '    mountInteractive,')
              path.write_text(source)

          if repaired != 6:
              raise SystemExit(f'Expected to repair 6 malformed \\end escapes, repaired {repaired}')

          css_path = Path('current/visuals/ch10/base.css')
          css = css_path.read_text()
          marker = '/* Browser-audit refinements: intrinsic sizing and formula flow. */'
          if marker not in css:
              css += r'''

          /* Browser-audit refinements: intrinsic sizing and formula flow. */
          .ch10-formal-flow,
          .ch10-formal-flow > *,
          .ch10-module,
          .ch10-module > *,
          .ch10-module-heading,
          .ch10-module-heading > div,
          .ch10-canvas-head > div:first-child {
            min-width: 0;
            max-width: 100%;
          }

          .ch10-formal-flow {
            width: 100%;
            grid-template-columns: minmax(0, 1fr);
          }

          .ch10-canvas-head > div:first-child {
            flex: 1 1 auto;
          }

          .ch10-canvas-head strong {
            min-width: 0;
            white-space: nowrap;
          }

          .ch10-formal-flow .katex-display,
          .ch10-example .katex-display {
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
          }

          @media (max-width: 720px) {
            .ch10-formal-lead,
            .ch10-formal-flow,
            .ch10-module {
              width: 100%;
              max-width: 100%;
            }
          }
          '''
              css_path.write_text(css)
          PY

      - name: Verify source audit
        run: node tests/ch10-source-audit.cjs

      - name: Commit normalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current/visuals/ch10/section1-presentation.js current/visuals/ch10/section2-presentation.js current/visuals/ch10/section3-presentation.js current/visuals/ch10/base.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ch10): repair formulas and responsive sizing"
          git push origin HEAD:content/ch10-dual-bilinear-symplectic
