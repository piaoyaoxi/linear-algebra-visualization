name: Apply Chapter 7 context payload

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-ch7-context.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out context branch
        uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
      - name: Report payload part hashes
        run: 'for file in .github/ch7-payload/part-*; do printf "%s:%s:%s;" "$(basename "$file")" "$(wc -c < "$file")" "$(sha256sum "$file" | cut -d" " -f1)"; done; echo; exit 1'
