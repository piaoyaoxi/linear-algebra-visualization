name: PR static preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write
  issues: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose staged Chapter 1 rebuild
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          parts = sorted(Path('_dev').glob('ch1-payload.part*'))
          print('parts:', [p.name for p in parts])
          for part in parts:
              data = part.read_bytes()
              print(part.name, len(data), hashlib.sha256(data).hexdigest())
          payload = b''.join(part.read_bytes() for part in parts)
          print('combined length:', len(payload))
          print('combined sha256:', hashlib.sha256(payload).hexdigest())
          if len(payload) != 72216:
              raise SystemExit('unexpected base64 length')
          if hashlib.sha256(payload).hexdigest() != '88790b4f83603b6281ff456b42d086a1d117b1da4fe85a9fb9024b8c8c2b91b6':
              raise SystemExit('unexpected base64 sha256')
          archive = base64.b64decode(payload, validate=True)
          print('archive length:', len(archive))
          print('archive sha256:', hashlib.sha256(archive).hexdigest())
          Path('/tmp/ch1-rebuild.tar.gz').write_bytes(archive)
          with tarfile.open('/tmp/ch1-rebuild.tar.gz', 'r:gz') as tar:
              names = tar.getnames()
              print('archive entries:', len(names))
              print('\n'.join(names[:25]))
          PY

  cleanup-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo cleanup