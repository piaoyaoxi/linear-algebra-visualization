  min-width: 0;
  padding: 11px 13px;
  border-bottom: 1px solid var(--line);
}

.ch3-vector-table > div:last-child {
  border-bottom: 0;
}

.ch3-vector-table > div > span {
  color: var(--muted);
  font-weight: 800;
}

.ch3-vector-table > div.is-result {
  background: color-mix(in srgb, var(--blue) 7%, var(--surface-solid));
}

.ch3-details {
  overflow: hidden;
}

.ch3-details summary {
  padding: 14px 16px;
  color: var(--text);
  font-weight: 760;
  cursor: pointer;
}

.ch3-details[open] summary {
  border-bottom: 1px solid var(--line);
}

.ch3-details .ch3-vector-editor,
.ch3-rref-details > div {
  padding: 16px;
}

.ch3-vector-editor > section {
  background: transparent;
}

.ch3-coordinate-summary {
  display: grid;
  grid-template-columns: minmax(150px, 0.32fr) minmax(0, 1fr);
  gap: 18px;
  padding: 17px;
}

.ch3-coordinate-summary p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.ch3-bar-row {
  grid-template-columns: 42px minmax(0, 1fr) 52px;
}

.ch3-bar-row.is-negative .ch3-bar-fill {
  background: var(--coral);
}

.ch3-operation-grid {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-soft);
}

.ch3-solution-layout {
  grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
}

.ch3-solution-readout {
  gap: 16px;
}

.ch3-panel-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  margin-bottom: 12px;
}

.ch3-panel-heading h4 {
  margin: 0;
}

.ch3-panel-heading span {
  color: var(--muted);
  font-size: 12px;
}

.ch3-solution-summary {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.ch3-solution-summary .ch3-meter-card:nth-child(2n) {
  border-right: 0;
}

.ch3-solution-summary .ch3-meter-card:nth-child(-n+2) {
  border-bottom: 1px solid var(--line);
}

.ch3-decomposition {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.1fr) auto minmax(0, 1fr);
  gap: 12px;
  align-items: stretch;
}

.ch3-decomposition article {
  display: grid;
  gap: 10px;
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-solid);
}

.ch3-decomposition article > span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 760;
}

.ch3-decomposition article.is-current {
  border-color: color-mix(in srgb, var(--blue) 34%, var(--line));
  background: color-mix(in srgb, var(--blue) 6%, var(--surface-solid));
}

.ch3-decomposition-value {
  min-width: 0;
  overflow-x: auto;
  font-size: 14px;
}

.ch3-decomposition-arrow {
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 24px;
  font-weight: 500;
}

.ch3-proof-strip {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface-solid);
}

.ch3-proof-strip > div {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 16px;
}

.ch3-proof-strip > div + div {
  border-left: 1px solid var(--line);
}

.ch3-proof-strip strong {
  display: block;
  margin-bottom: 4px;
}

.ch3-proof-strip p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.ch3-check {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--surface-soft);
  font-weight: 900;
}

.ch3-check.is-ok { color: var(--accent-strong); background: var(--accent-soft); }
.ch3-check.is-bad { color: var(--coral); background: color-mix(in srgb, var(--coral) 10%, var(--surface-solid)); }
.ch3-check.is-muted { color: var(--muted); }

.ch3-resultant-steps {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.ch3-resultant-steps > section {
  padding: 16px;
  background: var(--surface-solid);
}

.ch3-resultant-steps > section.is-current {
  grid-column: 1 / -1;
  border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
  box-shadow: var(--shadow-soft);
}

@media (max-width: 980px) {
  .ch3-lab-grid,
  .ch3-scene-grid,
  .ch3-solution-layout {
    grid-template-columns: 1fr;
  }

  .ch3-stage {
    height: 350px;
    min-height: 350px;
  }

  .ch3-decomposition {
    grid-template-columns: 1fr;
  }

  .ch3-decomposition-arrow {
    min-height: 20px;
  }
}

@media (max-width: 680px) {
  .ch3-mission {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .ch3-mission-result {
    white-space: normal;
  }

  .ch3-stage {
    height: 290px;
    min-height: 290px;
  }

  .ch3-meter,
  .ch3-meter.is-3,
  .ch3-meter.is-4,
  .ch3-solution-summary,
  .ch3-proof-strip,
  .ch3-coordinate-summary,
  .ch3-resultant-steps {
    grid-template-columns: 1fr;
  }

  .ch3-meter-card,
  .ch3-solution-summary .ch3-meter-card {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .ch3-meter-card:last-child,
  .ch3-solution-summary .ch3-meter-card:last-child {
    border-bottom: 0;
  }

  .ch3-proof-strip > div + div {
    border-left: 0;
    border-top: 1px solid var(--line);
  }

  .ch3-coordinate-summary {
    gap: 12px;
  }

  .ch3-scenario-row > label {
    grid-template-columns: 1fr;
  }

  .ch3-stage-caption {
    align-items: flex-start;
    flex-direction: column;
  }

  .ch3-resultant-steps > section.is-current {
    grid-column: auto;
  }
}
'''
          css_path.write_text(css_source)
          PY

          find current/visuals/ch3 -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

      - name: Install Chromium
        run: |
          mkdir -p /tmp/ch3-redesign-test
          cd /tmp/ch3-redesign-test
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser review and screenshots
        run: |
          mkdir -p browser-artifacts
          python3 -m http.server 4173 --directory current >/tmp/ch3-redesign-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4173/learn.html >/dev/null && break
            sleep 1
          done
          cat > /tmp/ch3-redesign-test/check.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const out = process.env.ARTIFACT_DIR;
          await fs.mkdir(out, { recursive: true });
          const routes = [
            ['elimination', 'elimination'],
            ['n-vector-space', 'vector-space'],
            ['linear-dependence', 'dependence'],
            ['matrix-rank', 'rank'],
            ['solvability', 'solvability'],
            ['solution-structure', 'solution-structure'],
            ['binary-higher-degree', 'resultant'],
          ];
          const browser = await chromium.launch({ headless: true });
          const failures = [];

          async function inspect(page, route, lab, mode) {
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });
            await page.goto(`http://127.0.0.1:4173/learn.html#ch3/${route}`, { waitUntil: 'networkidle' });
            await page.waitForSelector(`[data-ch3-lab="${lab}"]`);
            await page.waitForFunction(() => document.querySelectorAll('.katex').length > 4);
            const state = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - window.innerWidth,
              katexErrors: document.querySelectorAll('.katex-error').length,
              canvas: Array.from(document.querySelectorAll('canvas')).map((c) => {
                const r = c.getBoundingClientRect(); return [r.width, r.height];
              }),
            }));
            assert.ok(state.overflow <= 4, `${mode}/${route}: horizontal overflow ${state.overflow}`);
            assert.equal(state.katexErrors, 0, `${mode}/${route}: KaTeX errors`);
            assert.ok(state.canvas.every(([w, h]) => w > 180 && h > 220), `${mode}/${route}: unusable canvas`);
            assert.deepEqual(errors, [], `${mode}/${route}: ${errors.join('; ')}`);
          }

          const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          for (const [route, lab] of routes) {
            const page = await desktop.newPage();
            try {
              await inspect(page, route, lab, 'desktop');
              if (route === 'elimination') {
                await page.click('[data-preset="swapPivot"]');
                await page.click('[data-guide]');
              } else if (route === 'n-vector-space') {
                await page.locator('[data-n]').evaluate((el) => { el.value = '2'; el.dispatchEvent(new Event('input', { bubbles: true })); });
                await page.locator('[data-alpha]').evaluate((el) => { el.value = '1.5'; el.dispatchEvent(new Event('input', { bubbles: true })); });
                await page.locator('[data-beta]').evaluate((el) => { el.value = '-0.8'; el.dispatchEvent(new Event('input', { bubbles: true })); });
              } else if (route === 'linear-dependence') {
                await page.click('[data-preset="three"]');
              } else if (route === 'matrix-rank') {
                await page.click('[data-preset="projectionTrap"]');
              } else if (route === 'solvability') {
                await page.click('[data-preset="miss"]');
              } else if (route === 'solution-structure') {
                const slider = page.locator('[data-param]').first();
                await slider.evaluate((el) => { el.value = '1.35'; el.dispatchEvent(new Event('input', { bubbles: true })); });
                assert.match(await page.locator('[data-verify-axb]').innerText(), /通过/);
                assert.match(await page.locator('[data-verify-null]').innerText(), /通过/);
              } else if (route === 'binary-higher-degree') {
                await page.click('[data-preset="tangent"]');
                for (let i = 0; i < 5; i += 1) await page.click('[data-next]');
              }
              await page.waitForTimeout(100);
              await page.screenshot({ path: `${out}/desktop-${route}.png`, fullPage: true });
              if (route === 'n-vector-space' || route === 'solution-structure' || route === 'solvability') {
                await page.locator('[data-ch3-lab] .ch3-stage').screenshot({ path: `${out}/stage-${route}.png` });
              }
              console.log(`PASS desktop ${route}`);
            } catch (error) {
              failures.push(`desktop ${route}: ${error.stack || error.message}`);
            } finally { await page.close(); }
          }
          await desktop.close();

          const mobile = await browser.newContext({ viewport: { width: 390, height: 844 } });
          for (const [route, lab] of routes) {
            const page = await mobile.newPage();
            try {
              await inspect(page, route, lab, 'mobile');
              await page.screenshot({ path: `${out}/mobile-${route}.png`, fullPage: true });
              console.log(`PASS mobile ${route}`);
            } catch (error) {
              failures.push(`mobile ${route}: ${error.stack || error.message}`);
            } finally { await page.close(); }
          }
          await mobile.close();

          const dark = await browser.newContext({ viewport: { width: 1280, height: 900 }, colorScheme: 'dark' });
          for (const route of ['n-vector-space', 'solution-structure']) {
            const page = await dark.newPage();
            try {
              await page.goto(`http://127.0.0.1:4173/learn.html#ch3/${route}`, { waitUntil: 'networkidle' });
              await page.click('#themeToggle');
              await page.waitForFunction(() => document.body.classList.contains('dark'));
              await page.screenshot({ path: `${out}/dark-${route}.png`, fullPage: true });
              console.log(`PASS dark ${route}`);
            } catch (error) { failures.push(`dark ${route}: ${error.stack || error.message}`); }
            finally { await page.close(); }
          }
          await dark.close();
          await browser.close();
          if (failures.length) {
            console.error(failures.join('\n\n'));
            process.exit(1);
          }
          JS
          cd /tmp/ch3-redesign-test
          set +e
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/browser-artifacts" node check.mjs 2>&1 | tee "${GITHUB_WORKSPACE}/browser-artifacts/browser.log"
          status=${PIPESTATUS[0]}
          set -e
          exit ${status}

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch3-redesign-browser-review
          path: browser-artifacts/
          if-no-files-found: warn

      - name: Commit the verified redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ch3-redesign.yml
          git add current/visuals/ch3/shared-math.js current/visuals/ch3/shared-presentation.css current/visuals/ch3/section1-3-presentation.js current/visuals/ch3/section4-6-presentation.js current/visuals/ch3/section7-presentation.js
          git commit -m "refactor(ch3): rebuild visual hierarchy and vector interactions"
          git push -q origin HEAD:"${BRANCH_NAME}"
