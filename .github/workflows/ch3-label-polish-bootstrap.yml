name: Chapter 3 label polish diagnostics

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'content/ch3-linear-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH_NAME: content/ch3-linear-systems
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch PR branch
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${BRANCH_NAME}"
          git checkout -q -B "${BRANCH_NAME}" FETCH_HEAD

      - name: Apply patch and capture checks
        run: |
          mkdir -p browser-artifacts
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/ch3-label-polish.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start + 1:end]]
          Path('/tmp/apply_label_polish.py').write_text('\n'.join(body) + '\n')
          PY
          set +e
          python3 /tmp/apply_label_polish.py >browser-artifacts/patch.log 2>&1
          patch_status=$?
          node --check current/visuals/ch3/shared-math.js >browser-artifacts/shared-math.log 2>&1
          math_status=$?
          node --check current/visuals/ch3/section1-3-presentation.js >browser-artifacts/section1-3.log 2>&1
          vector_status=$?
          node --check current/visuals/ch3/section4-6-presentation.js >browser-artifacts/section4-6.log 2>&1
          solution_status=$?
          git diff --check >browser-artifacts/diff-check.log 2>&1
          diff_status=$?
          git diff >browser-artifacts/changes.diff
          printf 'patch=%s math=%s vector=%s solution=%s diff=%s\n' "$patch_status" "$math_status" "$vector_status" "$solution_status" "$diff_status" | tee browser-artifacts/status.txt
          set -e
          test "$patch_status" -eq 0
          test "$math_status" -eq 0
          test "$vector_status" -eq 0
          test "$solution_status" -eq 0
          test "$diff_status" -eq 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch3-label-polish-diagnostics
          path: browser-artifacts/
          if-no-files-found: warn
