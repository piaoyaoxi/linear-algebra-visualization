name: Chapter 9 browser check

on:
  pull_request:
    paths:
      - "current/**"
      - ".github/scripts/ch9-browser-check.mjs"
      - ".github/workflows/ch9-browser-check.yml"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/actions/setup-playwright/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Node and the pinned Playwright
        uses: ./.github/actions/setup-playwright

      - name: Start static site
        run: |
          python3 .github/scripts/serve.py 4173 current > /tmp/ch9-static.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/learn.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ch9-static.log
          exit 1

      - name: Exercise Chapter 9 in Chromium
        run: node .github/scripts/ch9-browser-check.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch9-browser-screenshots
          path: /tmp/ch9-browser-screenshots
          if-no-files-found: error
