name: Chapter 8 rework bootstrap

on:
  push:
    branches:
      - context/ch8-lambda-matrices
    paths:
      - ".github/ch8-rework.part-*"
      - ".github/workflows/ch8-rework-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.ref == 'refs/heads/context/ch8-lambda-matrices'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ch8-rework-bootstrap
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context/ch8-lambda-matrices
          fetch-depth: 0

      - name: Rebuild Chapter 8 rework payload
        run: |
          cat \
            .github/ch8-rework.part-00 \
            .github/ch8-rework.part-01 \
            .github/ch8-rework.part-02 \
            .github/ch8-rework.part-03 \
            .github/ch8-rework.part-04 \
            .github/ch8-rework.part-05 \
            .github/ch8-rework.part-06 \
            .github/ch8-rework.part-07 \
            .github/ch8-rework.part-08 \
            .github/ch8-rework.part-09a \
            .github/ch8-rework.part-09b \
            .github/ch8-rework.part-09c \
            .github/ch8-rework.part-09d \
            .github/ch8-rework.part-09e \
            | base64 -d > /tmp/ch8-rework.tar.gz
          echo "ec74f5f7d562f5ce80496eaa980d75074a2d69915327d15266d106e2bff9d74a  /tmp/ch8-rework.tar.gz" | sha256sum --check
          tar -tzf /tmp/ch8-rework.tar.gz

      - name: Unpack and verify source
        run: |
          tar -xzf /tmp/ch8-rework.tar.gz -C .
          node --check current/content/ch8.js
          node --check current/ch8-entry.js
          node --check current/visuals/ch8/ch8.js
          node --check current/visuals/ch8/section1.js
          node --check current/visuals/ch8/section2.js
          node --check current/visuals/ch8/section3.js
          node --check current/visuals/ch8/section4.js
          node --check current/visuals/ch8/section5.js
          node --check current/visuals/ch8/section6.js
          node --check current/visuals/ch8/section7.js
          node --check .github/scripts/ch8-browser-check.mjs
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          css = Path('current/visuals/ch8/ch8.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'unbalanced CSS braces'
          class Parser(HTMLParser):
              pass
          Parser().feed(Path('current/learn.html').read_text(encoding='utf-8'))
          for name in range(1, 8):
              assert Path(f'current/visuals/ch8/section{name}.js').is_file()
          print('static source verification passed')
          PY

      - name: Create remote Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repository = os.environ['GH_REPOSITORY']
          api_root = f'https://api.github.com/repos/{repository}'

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'chapter-8-rework-bootstrap',
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors='replace')
                  print(f'HTTP {error.code} while calling {method} {path}: {detail}', flush=True)
                  raise

          final_paths = [
              'current/content/ch8.js',
              'current/ch8-entry.js',
              'current/learn.html',
              'current/visuals/ch8/ch8.js',
              'current/visuals/ch8/ch8.css',
              'current/visuals/ch8/section1.js',
              'current/visuals/ch8/section2.js',
              'current/visuals/ch8/section3.js',
              'current/visuals/ch8/section4.js',
              'current/visuals/ch8/section5.js',
              'current/visuals/ch8/section6.js',
              'current/visuals/ch8/section7.js',
              '.github/scripts/ch8-browser-check.mjs',
              '.github/workflows/ch8-browser-check.yml',
              'docs/ch8-production-matrix.md',
          ]
          temporary_paths = [
              *[f'.github/ch8-rework.part-{index:02d}' for index in range(10)],
              *[f'.github/ch8-rework.part-09{letter}' for letter in 'abcde'],
              '.github/workflows/ch8-rework-bootstrap.yml',
          ]

          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          entries = []
          for path in final_paths:
              content = base64.b64encode(Path(path).read_bytes()).decode()
              blob = api('POST', '/git/blobs', {'content': content, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for path in temporary_paths:
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})

          tree = api('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'feat(ch8): rebuild lessons around visible causal experiments',
              'tree': tree['sha'],
              'parents': [parent],
          })
          output = Path('/tmp/ch8-rework-remote-commit.txt')
          output.write_text(commit['sha'] + '\n')
          print('REMOTE_COMMIT=' + commit['sha'])
          PY

      - name: Upload remote commit pointer
        uses: actions/upload-artifact@v4
        with:
          name: ch8-rework-remote-commit
          path: /tmp/ch8-rework-remote-commit.txt
          if-no-files-found: error
