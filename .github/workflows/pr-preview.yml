name: PR static preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  publish-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Validate staged Chapter 1 payload
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ch1-parts
          for index in 00 01 02 03 04 05 06 07; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/contents/_dev/ch1-payload.part$index?ref=$HEAD_REF" \
              | jq -r '.content' \
              | base64 -d > "/tmp/ch1-parts/part$index"
          done
          cat /tmp/ch1-parts/part* > /tmp/ch1-rebuild.b64
          echo "part sizes:"
          wc -c /tmp/ch1-parts/part*
          echo "combined:"
          wc -c /tmp/ch1-rebuild.b64
          sha256sum /tmp/ch1-rebuild.b64
          base64 -d /tmp/ch1-rebuild.b64 > /tmp/ch1-rebuild.tar.gz
          wc -c /tmp/ch1-rebuild.tar.gz
          sha256sum /tmp/ch1-rebuild.tar.gz
          tar -tzf /tmp/ch1-rebuild.tar.gz

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo cleanup