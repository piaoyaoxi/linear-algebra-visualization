name: Chapter 3 final label bootstrap

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  final-polish:
    if: github.event.pull_request.head.ref == 'content/ch3-linear-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH_NAME: content/ch3-linear-systems
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch PR branch
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${BRANCH_NAME}"
          git checkout -q -B "${BRANCH_NAME}" FETCH_HEAD

      - name: Extract and apply final patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/ch3-label-final.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start + 1:end]]
          Path('/tmp/apply_final_labels.py').write_text('\n'.join(body) + '\n')
          print(f'extracted {len(body)} Python lines')
          PY
          python3 /tmp/apply_final_labels.py
          node --check current/visuals/ch3/shared-math.js
          node --check current/visuals/ch3/section1-3-presentation.js
          node --check current/visuals/ch3/section4-6-presentation.js
          git diff --check

      - name: Install Chromium runtime
        run: |
          mkdir -p /tmp/ch3-final-bootstrap
          cd /tmp/ch3-final-bootstrap
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Extract and run final browser review
        run: |
          mkdir -p browser-artifacts
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/ch3-label-final.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "cat > /tmp/ch3-final-test/check.mjs <<'JS'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'JS')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start + 1:end]]
          Path('/tmp/ch3-final-bootstrap/check.mjs').write_text('\n'.join(body) + '\n')
          print(f'extracted {len(body)} JavaScript lines')
          PY
          python3 -m http.server 4173 --directory current >/tmp/ch3-final-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4173/learn.html >/dev/null && break
            sleep 1
          done
          cd /tmp/ch3-final-bootstrap
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/browser-artifacts" node check.mjs

      - name: Upload final visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch3-final-label-review
          path: browser-artifacts/
          if-no-files-found: warn

      - name: Commit final browser polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ch3-label-final.yml .github/workflows/ch3-label-final-bootstrap.yml .github/workflows/ch3-label-polish.yml .github/workflows/ch3-label-polish-bootstrap.yml .ch3-label-polish-trigger
          git add current/visuals/ch3/shared-math.js current/visuals/ch3/section1-3-presentation.js current/visuals/ch3/section4-6-presentation.js
          git commit -m "fix(ch3): separate vector labels after browser review"
          git push -q origin HEAD:"${BRANCH_NAME}"
