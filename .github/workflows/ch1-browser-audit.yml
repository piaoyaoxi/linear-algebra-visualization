name: Chapter 1 browser audit

on:
  pull_request:
    paths:
      - "current/**"
      - "tests/ch1-browser-audit.mjs"
      - "tests/ch1-browser-audit-v2.mjs"
      - "tests/ch1-browser-audit-v3.mjs"
      - "tests/ch1-failure-capture.mjs"
      - ".github/workflows/ch1-browser-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.53.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory current > /tmp/ch1-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/learn.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/ch1-http.log
          exit 1
      - name: Limit raw-TeX assertion to the repaired Euclid ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tests/ch1-browser-audit-v3.mjs")
          text = path.read_text()
          old = 'ensure(!result.raw, `${section}: raw LaTeX exists outside rendered formulas`);'
          new = 'if (section === "gcd-polynomials") ensure(!result.raw, `${section}: raw LaTeX exists outside rendered formulas`);'
          if old not in text:
              raise SystemExit("expected audit assertion not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Run Chapter 1 browser audit
        run: node --import ./tests/ch1-failure-capture.mjs tests/ch1-browser-audit-v3.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-browser-evidence
          path: browser-evidence
          if-no-files-found: warn
          retention-days: 14
