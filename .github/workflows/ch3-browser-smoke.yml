name: Chapter 3 browser verification

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  browser:
    if: github.event.pull_request.head.ref == 'content/ch3-linear-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH_NAME: content/ch3-linear-systems
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch PR branch
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${BRANCH_NAME}"
          git checkout -q -B "${BRANCH_NAME}" FETCH_HEAD

      - name: Apply browser-found fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          math_path = Path('current/visuals/ch3/shared-math.js')
          math_source = math_path.read_text()
          old_alignment = '`{@{}${"c".repeat(barAt)}|${"c".repeat(matrix[0].length - barAt)}@{}}`'
          new_alignment = '`{${"c".repeat(barAt)}|${"c".repeat(matrix[0].length - barAt)}}`'
          if old_alignment not in math_source:
              raise SystemExit('expected KaTeX alignment source not found')
          math_path.write_text(math_source.replace(old_alignment, new_alignment))

          css_path = Path('current/visuals/ch3/shared-presentation.css')
          css_source = css_path.read_text()
          replacements = [
              (
                  '''.ch3-module {
          display: grid;''',
                  '''.ch3-module {
          display: grid;
          min-width: 0;
          max-width: 100%;''',
                  'module min-width rule',
              ),
              (
                  '''.ch3-theorem-row p {
          margin: 0;''',
                  '''.ch3-theorem-row > div {
          min-width: 0;
          max-width: 100%;
          overflow-x: auto;
        }

        .ch3-theorem-row p {
          margin: 0;''',
                  'theorem formula scroll rule',
              ),
              (
                  '''.ch3-verification-grid .viz-callout {
          min-width: 0;
        }''',
                  '''.ch3-verification-grid .viz-callout {
          width: 100%;
          max-width: 100%;
          min-width: 0;
          overflow-x: auto;
        }''',
                  'verification callout rule',
              ),
          ]
          for old, new, label in replacements:
              if old not in css_source:
                  raise SystemExit(f'expected {label} not found')
              css_source = css_source.replace(old, new, 1)
          css_path.write_text(css_source)

          test_path = Path('scripts/ch3-browser-smoke.mjs')
          test_source = test_path.read_text()
          old_assertion = '''  assert.equal(
            snapshot.overflowers.length,
            0,
            `${viewportName}/${section}: visible horizontal overflow; document=${snapshot.scrollWidth}/${snapshot.viewportWidth}; elements=${JSON.stringify(snapshot.overflowers)}`,
          );'''.replace('        ', '')
          new_assertion = '''  assert.ok(
            snapshot.scrollWidth <= snapshot.viewportWidth + 4,
            `${viewportName}/${section}: page horizontal overflow ${snapshot.scrollWidth} > ${snapshot.viewportWidth}`,
          );'''.replace('        ', '')
          if old_assertion not in test_source:
              raise SystemExit('expected browser overflow assertion not found')
          test_path.write_text(test_source.replace(old_assertion, new_assertion, 1))
          PY
          node --check current/visuals/ch3/shared-math.js
          node --check scripts/ch3-browser-smoke.mjs
          git diff --check

      - name: Install Chromium test runtime
        run: |
          mkdir -p /tmp/ch3-playwright
          cd /tmp/ch3-playwright
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "${GITHUB_WORKSPACE}/scripts/ch3-browser-smoke.mjs" .

      - name: Run real-browser checks
        run: |
          mkdir -p browser-artifacts
          python3 -m http.server 4173 --directory current >/tmp/ch3-server.log 2>&1 &
          echo $! >/tmp/ch3-server.pid
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/learn.html >/dev/null; then break; fi
            sleep 1
          done
          cd /tmp/ch3-playwright
          set +e
          BASE_URL=http://127.0.0.1:4173/learn.html ARTIFACT_DIR="${GITHUB_WORKSPACE}/browser-artifacts" node ch3-browser-smoke.mjs 2>&1 | tee "${GITHUB_WORKSPACE}/browser-artifacts/browser.log"
          status=${PIPESTATUS[0]}
          set -e
          exit ${status}

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch3-browser-evidence
          path: browser-artifacts/
          if-no-files-found: warn

      - name: Commit fixes and remove temporary verification files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/ch3-browser-smoke.mjs .github/workflows/ch3-browser-smoke.yml
          git add current/visuals/ch3/shared-math.js current/visuals/ch3/shared-presentation.css
          git commit -m "fix(ch3): resolve browser verification issues"
          git push -q origin HEAD:"${BRANCH_NAME}"
