name: Site audit

on:
  pull_request:
    paths:
      - "current/**"
      - ".github/scripts/site-audit.mjs"
      - ".github/scripts/reliability-smoke.mjs"
      - ".github/scripts/theme-transition-check.mjs"
      - ".github/scripts/layout-check.mjs"
      - ".github/scripts/selector-check.mjs"
      - ".github/scripts/perf-budget.mjs"
      - ".github/workflows/site-audit.yml"
      - ".github/scripts/check-font-coverage.py"
      - ".github/scripts/serve.py"
      - "tests/*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/actions/setup-playwright/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Node and the pinned Playwright
        uses: ./.github/actions/setup-playwright

      - name: Exact math unit tests
        run: node --test tests/*.test.mjs

      - name: Check serif font coverage
        run: |
          pip install --quiet fonttools brotli
          python3 .github/scripts/check-font-coverage.py

      - name: Start static site
        run: |
          python3 .github/scripts/serve.py 4173 current > /tmp/site-static.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/learn.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/site-static.log
          exit 1

      - name: Regression smoke (prediction locks, search snippets, storage fallbacks)
        run: node .github/scripts/reliability-smoke.mjs

      - name: Audit every lesson section
        run: node .github/scripts/site-audit.mjs

      - name: Light/dark switch moves every part together
        run: node .github/scripts/theme-transition-check.mjs

      - name: Layout (no gap under a canvas, no text on a box edge, no line opening with punctuation)
        run: node .github/scripts/layout-check.mjs

      - name: Shared layout selectors still match the labs (phone)
        run: node .github/scripts/selector-check.mjs

      - name: Performance budget (phone, 4× slower CPU, moving between lessons)
        run: node .github/scripts/perf-budget.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: /tmp/site-audit
          if-no-files-found: ignore
