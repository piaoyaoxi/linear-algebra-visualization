name: Chapter 3 SVG story browser review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  browser-review:
    if: github.event.pull_request.head.ref == 'content/ch3-linear-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Apply final screenshot-review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('current/visuals/ch3/visual-story.css')
          css = css_path.read_text()
          replacements = [
              (
                  '.ch3-story-animate { opacity: 0; animation: ch3-story-in 520ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--story-delay, 0ms); }',
                  '.ch3-story-animate { opacity: 0; animation: ch3-story-in 520ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--story-delay, 0ms); will-change: opacity; }',
              ),
              (
                  '@keyframes ch3-story-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }',
                  '@keyframes ch3-story-in { from { opacity: 0; } to { opacity: 1; } }',
              ),
              (
                  '.ch3-story-header { max-width: 900px; margin-bottom: 1.25rem; }',
                  '.ch3-story-section { margin: 2rem 0; }\n.ch3-story-section > h2 { margin: 0 0 .9rem; }\n.ch3-story-section .ch3-visual-story { margin-top: 0; }\n.ch3-story-header { max-width: 900px; margin-bottom: 1.25rem; }',
              ),
              (
                  '.ch3-story-step-list { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .25rem; scrollbar-width: thin; } .ch3-story-step-list button { flex: 0 0 auto; grid-template-columns: 1.8rem auto; padding: .56rem .72rem; font-size: .82rem; }',
                  '.ch3-story-step-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: .4rem; overflow: visible; padding: 0; } .ch3-story-step-list button { min-width: 0; grid-template-columns: 1.7rem minmax(0, 1fr); padding: .56rem .62rem; font-size: .78rem; line-height: 1.3; }',
              ),
              (
                  '.ch3-story-guide { display: flex; } .ch3-story-step-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: .4rem; overflow: visible; padding: 0; }',
                  '.ch3-story-guide { display: flex; align-items: stretch; } .ch3-story-step-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .4rem; overflow: visible; padding: 0; } .ch3-story-step-list button:last-child:nth-child(odd) { grid-column: 1 / -1; }',
              ),
          ]
          for old, new in replacements:
              if old in css:
                  css = css.replace(old, new, 1)
          css_path.write_text(css)

          story_path = Path('current/visuals/ch3/visual-story.js')
          story = story_path.read_text()
          story = story.replace(
              '    const heading = interactive.querySelector(":scope > h2");\n    if (heading) heading.textContent = "视觉实验";',
              '    const heading = interactive.querySelector(":scope > h2");\n    if (heading) heading.textContent = "精确实验";',
              1,
          )
          story = story.replace(
              '    interactive.insertBefore(story, details);',
              '    const formal = root.querySelector(`#${CSS.escape(section.id)}-formal`);\n    const storySection = document.createElement("section");\n    storySection.className = "ch3-story-section";\n    storySection.innerHTML = "<h2>几何直觉</h2>";\n    storySection.append(story);\n    if (formal) formal.before(storySection);\n    else interactive.insertBefore(storySection, details);',
              1,
          )
          story_path.write_text(story)

          test_path = Path('scripts/ch3-visual-story-review.mjs')
          test = test_path.read_text()
          test = test.replace(
              "  await page.goto(`${baseUrl}#ch3/${section}`, { waitUntil: 'networkidle', timeout: 30_000 });\n  await page.waitForSelector(`[data-ch3-story=\"${section}\"]`);",
              "  await page.goto(`${baseUrl}#ch3/${section}`, { waitUntil: 'networkidle', timeout: 30_000 });\n  if (mode !== 'mobile' && !(await page.locator('body.sidebar-collapsed').count())) {\n    await page.click('#sidebarToggle');\n    await page.waitForTimeout(180);\n  }\n  await page.waitForSelector(`[data-ch3-story=\"${section}\"]`);",
          )
          test = test.replace(
              "    assert.ok(bbox && bbox.height > 220, `${section}: SVG collapsed at step ${index + 1}`);",
              "    assert.ok(bbox && bbox.height > (mode === 'mobile' ? 150 : 220), `${section}: SVG collapsed at step ${index + 1}`);",
          )
          test = test.replace("  await precision.locator('summary').click();", "  await precision.locator(':scope > summary').click();")
          test = test.replace(
              "  const snapshot = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, viewportWidth: window.innerWidth, storyCount: document.querySelectorAll('[data-ch3-story]').length }));",
              "  if (mode === 'desktop') await page.screenshot({ path: `${outputDir}/full-${section}.png`, fullPage: true });\n  const snapshot = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, viewportWidth: window.innerWidth, storyCount: document.querySelectorAll('[data-ch3-story]').length }));",
          )
          test = test.replace(
              "  const precision = page.locator('.ch3-precision-lab');",
              "  if (mode === 'mobile') {\n    const stepBoxes = await buttons.evaluateAll((items) => items.map((item) => { const box = item.getBoundingClientRect(); return { x: box.x, y: box.y, width: box.width }; }));\n    assert.ok(stepBoxes.every((box) => box.width > 130), `${section}: mobile step buttons are too narrow`);\n    assert.ok(stepBoxes.length < 2 || Math.abs(stepBoxes[0].y - stepBoxes[1].y) < 4, `${section}: mobile step buttons did not form a two-column grid`);\n  }\n\n  const precision = page.locator('.ch3-precision-lab');",
          )
          test_path.write_text(test)
          PY

      - name: Static checks
        run: |
          node --check current/visuals/ch3/visual-story.js
          node --check scripts/ch3-visual-story-review.mjs
          git diff --check

      - name: Install Chromium runtime
        run: |
          mkdir -p /tmp/ch3-playwright
          cd /tmp/ch3-playwright
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
          cp "${GITHUB_WORKSPACE}/scripts/ch3-visual-story-review.mjs" .

      - name: Run browser review
        run: |
          mkdir -p browser-artifacts
          python3 -m http.server 4173 --directory current >/tmp/ch3-story-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/learn.html >/dev/null; then break; fi
            sleep 1
          done
          cd /tmp/ch3-playwright
          set +e
          BASE_URL=http://127.0.0.1:4173/learn.html ARTIFACT_DIR="${GITHUB_WORKSPACE}/browser-artifacts" node ch3-visual-story-review.mjs 2>&1 | tee "${GITHUB_WORKSPACE}/browser-artifacts/browser.log"
          status=${PIPESTATUS[0]}
          set -e
          exit ${status}

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch3-svg-story-review
          path: browser-artifacts/
          if-no-files-found: warn

      - name: Commit browser-found fixes
        if: success()
        run: |
          if git diff --quiet; then
            echo "No browser-found fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current/visuals/ch3/visual-story.css current/visuals/ch3/visual-story.js scripts/ch3-visual-story-review.mjs
          git commit -m "fix(ch3): finish mobile visual-story layout"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
