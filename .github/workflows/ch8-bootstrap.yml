name: Chapter 8 payload bootstrap

on:
  push:
    branches:
      - context/ch8-lambda-matrices
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.ref == 'refs/heads/context/ch8-lambda-matrices' || github.head_ref == 'context/ch8-lambda-matrices'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context/ch8-lambda-matrices
          fetch-depth: 0

      - name: Rebuild and verify Chapter 8 payload
        run: |
          cat .github/ch8-payload.part-* | base64 -d > /tmp/ch8-payload.tar.gz
          echo "14b6b44302d2a28885b839c23e2aff40ad1bbb35eaabe4bb62cdea02254dece2  /tmp/ch8-payload.tar.gz" | sha256sum --check
          tar -tzf /tmp/ch8-payload.tar.gz

      - name: Unpack Chapter 8 implementation
        run: |
          tar -xzf /tmp/ch8-payload.tar.gz -C .
          rm .github/ch8-payload.part-* .github/workflows/ch8-bootstrap.yml
          node --check current/content/ch8.js
          node --check current/ch8-entry.js
          node --check current/visuals/ch8/ch8.js
          node --check .github/scripts/ch8-browser-check.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ch8): build lambda-matrix classification course"
          git push origin HEAD:context/ch8-lambda-matrices
