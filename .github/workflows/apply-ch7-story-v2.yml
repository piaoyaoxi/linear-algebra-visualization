name: Apply Chapter 7 story v2

on:
  push:
    branches:
      - context/ch7-linear-transformations
    paths:
      - ".github/workflows/apply-ch7-story-v2.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-ch7-story-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Chapter 7 branch
        uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
          fetch-depth: 0

      - name: Repair and unpack reviewed redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          import tarfile
          import zlib

          payload_dir = Path('.github/ch7-story-v2-payload')
          parts = [
              payload_dir / 'part-00',
              payload_dir / 'part-01',
              payload_dir / 'part-02',
              payload_dir / 'part-030',
              payload_dir / 'part-031',
              payload_dir / 'part-04',
          ]
          missing = [str(path) for path in parts if not path.exists()]
          if missing:
              raise SystemExit(f'missing payload parts: {missing}')

          encoded = ''.join(''.join(path.read_text().split()) for path in parts)
          encoded += '=' * (-len(encoded) % 4)
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def decode(text):
              return base64.b64decode(text, validate=False)

          def valid_archive(archive):
              try:
                  with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
                      names = tar.getnames()
                      required = {
                          'current/visuals/ch7/story-v2.js',
                          'current/visuals/ch7/story-v2.css',
                      }
                      if not required.issubset(set(names)):
                          return None
                      for member in tar.getmembers():
                          name = Path(member.name)
                          if name.is_absolute() or '..' in name.parts:
                              return None
                      return names
              except Exception:
                  return None

          archive = decode(encoded)
          names = valid_archive(archive)
          repaired = encoded

          if names is None:
              probe = zlib.decompressobj(16 + zlib.MAX_WBITS)
              fail_at = None
              for index, byte in enumerate(archive):
                  try:
                      probe.decompress(bytes([byte]))
                  except zlib.error:
                      fail_at = index
                      break
              if fail_at is None:
                  fail_at = max(0, len(archive) // 2)
              approximate = (fail_at // 3) * 4
              print(f'gzip stream fails near compressed byte {fail_at}; searching near base64 character {approximate}')

              candidates = []
              left = max(0, approximate - 28)
              right = min(len(encoded.rstrip('=')), approximate + 29)
              for position in range(left, right):
                  original = encoded[position]
                  for replacement in alphabet:
                      if replacement == original:
                          continue
                      candidate = encoded[:position] + replacement + encoded[position + 1:]
                      candidate_archive = decode(candidate)
                      candidate_names = valid_archive(candidate_archive)
                      if candidate_names is not None:
                          candidates.append((position, original, replacement, candidate, candidate_archive, candidate_names))
                          print(f'valid repair found at character {position}: {original!r} -> {replacement!r}')
                          break
                  if candidates:
                      break

              if not candidates:
                  for position in range(max(0, approximate - 12), min(len(encoded.rstrip('=')) - 1, approximate + 13)):
                      if encoded[position] == encoded[position + 1]:
                          continue
                      candidate = encoded[:position] + encoded[position + 1] + encoded[position] + encoded[position + 2:]
                      candidate_archive = decode(candidate)
                      candidate_names = valid_archive(candidate_archive)
                      if candidate_names is not None:
                          candidates.append((position, encoded[position:position+2], encoded[position+1] + encoded[position], candidate, candidate_archive, candidate_names))
                          print(f'valid adjacent swap repair found at character {position}')
                          break

              if not candidates:
                  raise SystemExit('unable to repair the reviewed story archive with a local one-character correction')

              _, _, _, repaired, archive, names = candidates[0]

          print('archive members:')
          for name in names:
              print(name)

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
              tar.extractall('.', filter='data')
          PY

      - name: Load the new story layer last
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("current/learn.html")
          text = path.read_text()

          css_anchor = '    <link rel="stylesheet" href="./visuals/ch7/cinematic.css?v=40b" />'
          css_tag = '    <link rel="stylesheet" href="./visuals/ch7/story-v2.css?v=40e" />'
          if css_tag not in text:
              if css_anchor not in text:
                  raise SystemExit("Chapter 7 cinematic stylesheet anchor missing")
              text = text.replace(css_anchor, css_anchor + "\n" + css_tag, 1)

          js_anchor = '    <script defer src="./visuals/ch7/drag-controls.js?v=40d"></script>'
          js_tag = '    <script defer src="./visuals/ch7/story-v2.js?v=40e"></script>'
          if js_tag not in text:
              if js_anchor not in text:
                  raise SystemExit("Chapter 7 drag-controls script anchor missing")
              text = text.replace(js_anchor, js_anchor + "\n" + js_tag, 1)

          path.write_text(text)
          PY
          rm -rf .github/ch7-story-v2-payload
          rm -f .github/workflows/apply-ch7-story-v2.yml
          rm -f docs/ch7-story-payload-diagnostic.txt

      - name: Validate final source
        shell: bash
        run: |
          set -euo pipefail
          node --check current/visuals/ch7/story-v2.js
          node --check .github/scripts/ch7-browser-check.mjs
          git diff --check
          grep -q 'story-v2.css?v=40e' current/learn.html
          grep -q 'story-v2.js?v=40e' current/learn.html

      - name: Commit to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(ch7): replace dashboard visuals with geometric stories"
          git push origin HEAD:context/ch7-linear-transformations
