name: Chapter 8 browser check

on:
  pull_request:
    paths:
      - "current/**"
      - ".github/scripts/ch8-browser-check.mjs"
      - ".github/workflows/ch8-browser-check.yml"
  push:
    branches:
      - context/ch8-lambda-matrices
    paths:
      - "current/**"
      - ".github/scripts/ch8-browser-check.mjs"
      - ".github/workflows/ch8-browser-check.yml"

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --directory current > /tmp/ch8-static.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/learn.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ch8-static.log
          exit 1
      - name: Exercise Chapter 8 in Chromium
        run: |
          mkdir -p /tmp/ch8-screenshots
          set -o pipefail
          if ! node .github/scripts/ch8-browser-check.mjs 2>&1 | tee /tmp/ch8-screenshots/browser-check.log; then
            node --input-type=module <<'JS' 2>&1 | tee -a /tmp/ch8-screenshots/browser-check.log
          import { chromium } from "playwright";
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await page.goto("http://127.0.0.1:4173/learn.html#ch8/lambda-matrix", { waitUntil: "networkidle" });
          await page.locator('[data-lambda-scene="scan"]').click();
          await page.locator('[data-scan-preset]').selectOption('jordan');
          await page.locator('[data-jump-root="2"]').click();
          console.log('SIGNAL COUNT', await page.locator('.ch8-signal-row').count());
          console.log('SIGNAL TEXT', JSON.stringify(await page.locator('.ch8-signal-row').innerText()));
          console.log('SIGNAL LABELS', JSON.stringify(await page.locator('.ch8-signal-row > div > span').allInnerTexts()));
          await browser.close();
          JS
            exit 1
          fi
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch8-browser-screenshots
          path: /tmp/ch8-screenshots
          if-no-files-found: error
