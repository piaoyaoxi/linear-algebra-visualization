name: Chapter 8 payload bootstrap

on:
  push:
    branches:
      - context/ch8-lambda-matrices
    paths:
      - ".github/ch8-payload.tar.gz"
      - ".github/workflows/ch8-bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context/ch8-lambda-matrices
          fetch-depth: 0

      - name: Unpack Chapter 8 implementation
        run: |
          tar -xzf .github/ch8-payload.tar.gz -C .
          rm .github/ch8-payload.tar.gz .github/workflows/ch8-bootstrap.yml
          node --check current/content/ch8.js
          node --check current/ch8-entry.js
          node --check current/visuals/ch8/ch8.js
          node --check .github/scripts/ch8-browser-check.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ch8): build lambda-matrix classification course"
          git push origin HEAD:context/ch8-lambda-matrices
