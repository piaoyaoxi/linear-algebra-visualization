name: Fix Chapter 7 LaTeX escapes

on:
  push:
    branches:
      - context/ch7-linear-transformations

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: context/ch7-linear-transformations
          fetch-depth: 0
      - name: Repair formula string escaping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'current/visuals/ch7/story-section2.js': {
                  r'"\det T=0\Rightarrow T^{-1}\text{ 不存在}"': r'"\\det T=0\\Rightarrow T^{-1}\\text{ 不存在}"',
                  r'"(T\circ S)(x)=T(S(x))"': r'"(T\\circ S)(x)=T(S(x))"',
                  r'"(S\circ T)(x)=S(T(x))"': r'"(S\\circ T)(x)=S(T(x))"',
              },
              'current/visuals/ch7/story-section5.js': {
                  r'"A\ne PDP^{-1}"': r'"A\\ne PDP^{-1}"',
                  r'"D(c_1,c_2)=(\lambda_1c_1,\lambda_2c_2)"': r'"D(c_1,c_2)=(\\lambda_1c_1,\\lambda_2c_2)"',
              },
              'current/visuals/ch7/story-section6.js': {
                  r'"\ker T=\{0\},\quad \operatorname{im}T=W"': r'"\\ker T=\\{0\\},\\quad \\operatorname{im}T=W"',
                  r'"T(x+k)=T(x),\quad k\in\ker T"': r'"T(x+k)=T(x),\\quad k\\in\\ker T"',
                  r'"T(x)=0\quad(\forall x)"': r'"T(x)=0\\quad(\\forall x)"',
              },
              'current/visuals/ch7/story-section7.js': {
                  r'"T(V)\subseteq V"': r'"T(V)\\subseteq V"',
                  r'"T(\{0\})=\{0\}"': r'"T(\\{0\\})=\\{0\\}"',
                  r'"T(W)\subseteq W"': r'"T(W)\\subseteq W"',
                  r'"T(W)\not\subseteq W"': r'"T(W)\\not\\subseteq W"',
              },
              'current/visuals/ch7/story-section8.js': {
                  r'"T=\lambda I,\quad N=T-\lambda I=0"': r'"T=\\lambda I,\\quad N=T-\\lambda I=0"',
                  r'"T(v_2)=\lambda v_2+v_1"': r'"T(v_2)=\\lambda v_2+v_1"',
                  r'"T(v_k)=\lambda v_k+v_{k-1}"': r'"T(v_k)=\\lambda v_k+v_{k-1}"',
                  r'"Nv_k=v_{k-1},\quad Nv_1=0"': r'"Nv_k=v_{k-1},\\quad Nv_1=0"',
              },
              'current/visuals/ch7/story-section9.js': {
                  r'"p(T)=0,\quad \deg p>\deg m_T"': r'"p(T)=0,\\quad \\deg p>\\deg m_T"',
                  r'"p(T)\ne0"': r'"p(T)\\ne0"',
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          node .github/scripts/ch7-source-lint.mjs
          for file in current/visuals/ch7/story-section{1..9}.js; do node --check "$file"; done
          rm -f .github/workflows/fix-ch7-latex.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --check --cached
          git commit -m "fix(ch7): repair LaTeX formula escaping"
          git push origin HEAD:context/ch7-linear-transformations
