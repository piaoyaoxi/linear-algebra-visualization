name: Chapter 3 reference audit

on:
  push:
    branches:
      - content/ch3-linear-systems
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.52.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 --directory current > /tmp/ch3-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/learn.html >/dev/null && break; sleep 1; done
      - name: Inspect all sections and steps
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const sections = [
            ['elimination','消元法'],
            ['n-vector-space','n维向量空间'],
            ['linear-dependence','线性相关性'],
            ['matrix-rank','矩阵的秩'],
            ['solvability','有解判别'],
            ['solution-structure','解的结构'],
            ['binary-higher-degree','二元高次'],
          ];
          fs.mkdirSync('audit-output', { recursive: true });
          const browser = await chromium.launch();
          const failures = [];

          async function review(viewport, prefix, dark = false) {
            const page = await browser.newPage({ viewportSize: viewport, colorScheme: dark ? 'dark' : 'light' });
            page.on('console', msg => { if (msg.type() === 'error') failures.push(`${prefix}: console ${msg.text()}`); });
            page.on('pageerror', err => failures.push(`${prefix}: pageerror ${err.message}`));
            await page.goto('http://127.0.0.1:4173/learn.html#ch3', { waitUntil: 'networkidle' });
            if (dark) {
              const bodyDark = await page.locator('body').evaluate(el => el.classList.contains('dark'));
              if (!bodyDark) await page.locator('#themeToggle').click();
            }
            for (const [id, label] of sections) {
              await page.getByText(label, { exact: true }).last().click();
              await page.waitForTimeout(350);
              const story = page.locator(`[data-ch3-story="${id}"]`);
              await story.waitFor({ state: 'visible' });
              await story.scrollIntoViewIfNeeded();
              await page.waitForTimeout(180);
              const buttons = story.locator('[data-story-step]');
              const count = await buttons.count();
              if (count !== 3) failures.push(`${prefix}/${id}: expected 3 steps, got ${count}`);
              for (let i = 0; i < count; i++) {
                await buttons.nth(i).click();
                await page.waitForTimeout(120);
                const active = await story.locator('[data-story-step].is-active').count();
                if (active !== 1) failures.push(`${prefix}/${id}/step${i}: active=${active}`);
                const panelActive = await story.locator('.ch3-panel-bg.is-active').count();
                if (viewport.width > 760 && panelActive !== 1) failures.push(`${prefix}/${id}/step${i}: panelActive=${panelActive}`);
                await story.screenshot({ path: `audit-output/${prefix}-${id}-step-${i + 1}.png` });
              }
              if (id === 'n-vector-space') {
                const ranges = story.locator('input[type="range"]');
                await ranges.nth(0).fill('-1.2');
                await ranges.nth(1).fill('1.25');
                await page.waitForTimeout(100);
                await story.screenshot({ path: `audit-output/${prefix}-${id}-slider-extreme.png` });
              }
              if (id === 'solution-structure') {
                const range = story.locator('input[type="range"]');
                await range.fill('-1');
                await page.waitForTimeout(100);
                await story.screenshot({ path: `audit-output/${prefix}-${id}-slider-extreme.png` });
              }
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
              if (overflow > 1) failures.push(`${prefix}/${id}: overflow ${overflow}`);
              const katexErrors = await page.locator('.katex-error').count();
              if (katexErrors) failures.push(`${prefix}/${id}: katex errors ${katexErrors}`);
              await page.screenshot({ path: `audit-output/${prefix}-${id}-page.png`, fullPage: true });
            }
            await page.goto('http://127.0.0.1:4173/learn.html#ch4/matrix-language', { waitUntil: 'networkidle' });
            if (!(await page.locator('#matrix-language').count())) failures.push(`${prefix}: chapter4 regression route missing`);
            await page.close();
          }

          await review({ width: 1440, height: 1100 }, 'desktop-light');
          await review({ width: 390, height: 844 }, 'mobile-light');
          await review({ width: 1440, height: 1100 }, 'desktop-dark', true);
          await browser.close();
          fs.writeFileSync('audit-output/errors.txt', failures.join('\n') || 'PASS');
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exitCode = 1;
          }
          EOF
          node /tmp/audit.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch3-reference-audit
          path: audit-output
