name: Chapter 3 final diagram polish

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: write

jobs:
  polish:
    if: github.event.pull_request.head.ref == 'content/ch3-linear-systems'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH_NAME: content/ch3-linear-systems
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch PR branch
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${BRANCH_NAME}"
          git checkout -q -B "${BRANCH_NAME}" FETCH_HEAD

      - name: Apply screenshot-driven refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          math = Path('current/visuals/ch3/shared-math.js')
          source = math.read_text()
          pattern = r'\s*let labelX = x2 \+ \(ux >= 0 \? 8 : -boxW - 8\);\s*\n\s*let labelY = y2 \+ \(uy >= 0 \? 7 : -boxH - 7\);'
          replacement = '''
      const labelT = options.labelT ?? 1;
      const labelOffset = options.labelOffset ?? 0;
      const anchorX = x1 + dx * labelT + px * labelOffset;
      const anchorY = y1 + dy * labelT + py * labelOffset;
      let labelX = anchorX + (ux >= 0 ? 8 : -boxW - 8);
      let labelY = anchorY + (uy >= 0 ? 7 : -boxH - 7);'''
          source, count = re.subn(pattern, replacement, source, count=1)
          if count != 1:
              raise SystemExit('label anchor pattern not found')
          math.write_text(source)

          vector = Path('current/visuals/ch3/section1-3-presentation.js')
          source = vector.read_text()
          source, count1 = re.subn(
              r'M\(\)\.drawArrowBetween\(sized\.ctx, frame, O, alphaU, frame\.p\.accent, "αu", 3\.1, \{ tailDot: true \}\);',
              'M().drawArrowBetween(sized.ctx, frame, O, alphaU, frame.p.accent, "αu", 3.1, { tailDot: true, labelT: 0.72, labelOffset: -9 });',
              source,
              count=1,
          )
          source, count2 = re.subn(
              r'M\(\)\.drawArrowBetween\(sized\.ctx, frame, alphaU, total, frame\.p\.coral, "βv", 3\.1\);',
              'M().drawArrowBetween(sized.ctx, frame, alphaU, total, frame.p.coral, "βv", 3.1, { labelT: 0.48, labelOffset: 12 });',
              source,
              count=1,
          )
          source, count3 = re.subn(
              r'M\(\)\.drawArrowBetween\(sized\.ctx, frame, O, total, frame\.p\.blue, "w", 3\.7\);',
              'M().drawArrowBetween(sized.ctx, frame, O, total, frame.p.blue, "w", 3.7, { labelT: 1, labelOffset: -12 });',
              source,
              count=1,
          )
          if (count1, count2, count3) != (1, 1, 1):
              raise SystemExit(f'vector call counts: {(count1, count2, count3)}')
          vector.write_text(source)

          solution = Path('current/visuals/ch3/section4-6-presentation.js')
          source = solution.read_text()
          pattern = re.compile(
              r'directions\.forEach\(\(direction, index\) => \{\s*'
              r'const endpoint = \[x0p\[0\] \+ direction\[0\], x0p\[1\] \+ direction\[1\]\];\s*'
              r'M\(\)\.drawArrowBetween\(sized\.ctx, frame, x0p, endpoint, frame\.p\.coral, `η\$\{index \+ 1\}`, 2\.7, \{ alpha: 0\.9 \}\);\s*'
              r'\}\);\s*\n\s*'
              r'if \(Math\.hypot\(xp\[0\] - x0p\[0\], xp\[1\] - x0p\[1\]\) > 1e-8\) \{\s*'
              r'M\(\)\.drawArrowBetween\(sized\.ctx, frame, x0p, xp, frame\.p\.blue, "参数位移", 2\.2, \{ dashed: true, alpha: 0\.72 \}\);\s*'
              r'\}',
              re.S,
          )
          replacement = '''directions.forEach((direction, index) => {
        const endpoint = [x0p[0] + 0.72 * direction[0], x0p[1] + 0.72 * direction[1]];
        M().drawArrowBetween(sized.ctx, frame, x0p, endpoint, frame.p.coral, `η${index + 1}`, 2.7, { alpha: 0.9, labelT: 0.62, labelOffset: 12 });
      });

      if (Math.hypot(xp[0] - x0p[0], xp[1] - x0p[1]) > 1e-8) {
        M().drawArrowBetween(sized.ctx, frame, x0p, xp, frame.p.blue, "", 2.2, { dashed: true, alpha: 0.72 });
      }'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('solution label pattern not found')
          solution.write_text(source)
          PY
          node --check current/visuals/ch3/shared-math.js
          node --check current/visuals/ch3/section1-3-presentation.js
          node --check current/visuals/ch3/section4-6-presentation.js
          git diff --check

      - name: Install Chromium runtime
        run: |
          mkdir -p /tmp/ch3-final-test
          cd /tmp/ch3-final-test
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify final diagrams in Chromium
        run: |
          mkdir -p browser-artifacts
          python3 -m http.server 4173 --directory current >/tmp/ch3-final-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --silent --fail http://127.0.0.1:4173/learn.html >/dev/null && break
            sleep 1
          done
          cat > /tmp/ch3-final-test/check.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const out = process.env.ARTIFACT_DIR;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          for (const route of ['n-vector-space', 'solution-structure']) {
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });
            await page.goto(`http://127.0.0.1:4173/learn.html#ch3/${route}`, { waitUntil: 'networkidle' });
            if (route === 'n-vector-space') {
              await page.locator('[data-n]').evaluate((el) => { el.value = '2'; el.dispatchEvent(new Event('input', { bubbles: true })); });
              await page.locator('[data-alpha]').evaluate((el) => { el.value = '1.5'; el.dispatchEvent(new Event('input', { bubbles: true })); });
              await page.locator('[data-beta]').evaluate((el) => { el.value = '-0.8'; el.dispatchEvent(new Event('input', { bubbles: true })); });
            } else {
              await page.locator('[data-param]').first().evaluate((el) => { el.value = '1.35'; el.dispatchEvent(new Event('input', { bubbles: true })); });
              assert.match(await page.locator('[data-verify-axb]').innerText(), /通过/);
              assert.match(await page.locator('[data-verify-null]').innerText(), /通过/);
            }
            await page.waitForTimeout(120);
            const snapshot = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - window.innerWidth,
              katexErrors: document.querySelectorAll('.katex-error').length,
            }));
            assert.ok(snapshot.overflow <= 4, `${route}: overflow ${snapshot.overflow}`);
            assert.equal(snapshot.katexErrors, 0);
            assert.deepEqual(errors, []);
            await page.locator('[data-ch3-lab] .ch3-stage').screenshot({ path: `${out}/stage-${route}.png` });
            await page.screenshot({ path: `${out}/desktop-${route}.png`, fullPage: true });
            await page.close();
          }
          await context.close();
          await browser.close();
          JS
          cd /tmp/ch3-final-test
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/browser-artifacts" node check.mjs

      - name: Upload final diagram review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch3-final-diagram-review
          path: browser-artifacts/
          if-no-files-found: warn

      - name: Commit final browser polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ch3-label-final.yml .github/workflows/ch3-label-polish.yml .github/workflows/ch3-label-polish-bootstrap.yml .ch3-label-polish-trigger
          git add current/visuals/ch3/shared-math.js current/visuals/ch3/section1-3-presentation.js current/visuals/ch3/section4-6-presentation.js
          git commit -m "fix(ch3): separate vector labels after browser review"
          git push -q origin HEAD:"${BRANCH_NAME}"
